name: Deploy

on:
  push:
    branches:
      - main
env:
  GH_TOKEN: '${{ secrets.GH_TOKEN }}'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: install
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            
            cd .ssh
            rm -rf Backend-Java-Travimate
            gh repo clone Travimate/Backend-Java-Travimate
            cd Backend-Java-Travimate
            mvn clean install -B
          
      - name: Kill and Install JAR file in VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            nohup java -jar .ssh/Backend-Java-Travimate/target/Travimate-0.0.1-SNAPSHOT.jar
            if pgrep -f Travimate-0.0.1-SNAPSHOT.jar; then
              echo "Application is already running. Skipping deployment."
              exit 0
            fi

    # Example of using the output
      - id: 'test'
        run: |-
          echo '${{ steps.compute-ssh.outputs.stdout }}'
          echo '${{ steps.compute-ssh.outputs.stderr }}'
