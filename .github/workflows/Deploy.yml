name: Deploy

on:
  push:
    branches:
      - main
env:
  GH_TOKEN: '${{ secrets.GH_TOKEN }}'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: install
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            trap "echo 'Received SIGTERM signal, ignoring...'" TERM
            pkill -f Travimate-0.0.1-SNAPSHOT.jar || true
            cd .ssh
            rm -rf Backend-Java-Travimate
            gh repo clone Travimate/Backend-Java-Travimate
            cd Backend-Java-Travimate
            mvn clean install
            trap - TERM
          
      - name: Kill and Install JAR file in VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            nohup java -jar .ssh/Backend-Java-Travimate/target/Travimate-0.0.1-SNAPSHOT.jar  > /dev/null 2>&1 &
            sleep 1
            exit 0

    # Example of using the output
      - id: 'test'
        run: |-
          echo '${{ steps.compute-ssh.outputs.stdout }}'
          echo '${{ steps.compute-ssh.outputs.stderr }}'
