name: BUILD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '17'

      - name: Build with Maven
        run: mvn clean install

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: 'Use gcloud CLI'
        run: 'gcloud info'

      - name: 'login ssh'
        run: gcloud compute ssh --zone "asia-southeast1-b" "instance-1" --project "synrgy-challenge"

#      - name: 'login github from ssh'
#        run: |-
#          cd .ssh
#          cat ~/.ssh/github-key.pub
#          ssh-add ~/.ssh.github-key

      - name: 'clone repository'
        run: gh repo clone Travimate/Backend-Java-Travimate

      - name: 'run spring boot'
        run: |-
          cd Backend-Java-Travimate
          mvn spring-boot:run